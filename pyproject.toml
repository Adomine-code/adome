[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adome"
version = "0.0.0"
readme = "README.md"

[project.urls]
Repository = "https://github.com/Ucas-Yunhui/adome"
Issues = "https://github.com/Ucas-Yunhui/adome/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["adome", "adome.*"]

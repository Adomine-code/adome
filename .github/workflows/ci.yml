name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: "3.13"
      - name: Install check tools
        run: '"${{ steps.python.outputs.python-path }}" -m pip install build twine ruff'
      - name: Check code quality
        run: '"${{ steps.python.outputs.python-path }}" -m ruff check --no-cache --output-format=github .'
      - name: Build distributions
        run: '"${{ steps.python.outputs.python-path }}" -m build'
      - name: Check distribution metadata
        run: '"${{ steps.python.outputs.python-path }}" -m twine check --strict dist/*'
      - name: Verify wheel installation
        run: |
          "${{ steps.python.outputs.python-path }}" -m pip install --no-deps dist/*.whl
          "${{ steps.python.outputs.python-path }}" -I -c "import adome"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        id: python
        with:
          python-version: "3.13.15"
      - run: |
          "${{ steps.python.outputs.python-path }}" -m pip install build ruff
          "${{ steps.python.outputs.python-path }}" -m ruff check
          "${{ steps.python.outputs.python-path }}" -m build
          "${{ steps.python.outputs.python-path }}" -m pip install dist/*.whl
          "${{ steps.python.outputs.python-path }}" -I -c "import adome"
